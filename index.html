  function endGame(won) {
    core.isBusy = true;
    if (core.freePlay) {
      stopFreePlayTimer();
      const isPumpkinChallenge = pumpkinChallenge;
      const previousBest = isPumpkinChallenge ? pumpkinChallengeBest : freePlayBest;
      let currentBest = previousBest;
      if (core.score > currentBest) {
        currentBest = core.score;
        if (isPumpkinChallenge) {
          pumpkinChallengeBest = currentBest;
          try { localStorage.setItem('monster-smash-pumpkin-challenge-best', String(currentBest)); } catch (_) {}
        } else {
          freePlayBest = currentBest;
          try { localStorage.setItem('monster-smash-free-play-best', String(currentBest)); } catch (_) {}
        }
      }
      playSound(core.score > previousBest ? 'next-level' : 'lose');
      const isNewBest = core.score > previousBest;
      // The board gets its final moment to settle, then this matches the
      // countdown's blur treatment while the score is revealed.
      modalOverlay.classList.add('free-play-result');
      showModal(
        '<h2 class="modal-title">Time\'s Up!</h2>' +
        '<p class="modal-sub">' + (isNewBest ? 'New high score — incredible smashing!' : 'Your time is up. Great smashing!') + '</p>' +
        '<div class="modal-score">Final Score<br><span>' + core.score.toLocaleString() + '</span>' +
          '<div class="free-play-high-score">High Score<strong>' + currentBest.toLocaleString() + '</strong></div></div>' +
        '<div class="modal-actions"><button class="btn btn-primary" id="free-replay-btn">Play Again</button><button class="btn btn-ghost" id="select-btn">Main Menu</button></div>'
      );
      const freeReplayBtn = document.getElementById('free-replay-btn');
      if (freeReplayBtn) freeReplayBtn.addEventListener('click', () => { hideModal(); startFreePlay(isPumpkinChallenge ? 'pumpkin' : 'free'); });
      const freeSelectBtn = document.getElementById('select-btn');
      if (freeSelectBtn) freeSelectBtn.addEventListener('click', () => {
        hideModal(); stopFreePlayTimer(); core.freePlay = false; core.freePlayOver = false;
        gameScreen.classList.add('hidden'); showMainMenu(); startScreen.classList.remove('hidden');
      });
      return;
    }
    playSound(won ? 'next-level' : 'lose');
    const isLast = core.currentLevel >= LEVELS.length;
    let title, sub, buttonsHtml;

    if (won) {
      core.highestUnlocked = Math.max(core.highestUnlocked, Math.min(core.currentLevel + 1, LEVELS.length));
      try { localStorage.setItem('monster-smash-highest-unlocked', String(core.highestUnlocked)); } catch (_) {}
      if (isLast) {
        title = 'The Cauldron Overflows!';
        sub = 'You\u2019ve conquered every corner of the cauldron.';
        buttonsHtml =
          '<button class="btn btn-primary" id="replay-btn">Replay Level</button>' +
          '<button class="btn btn-ghost" id="select-btn">Level Select</button>';
      } else {
        title = 'Level ' + core.currentLevel + ' Complete!';
        sub = 'Onward to \u201c' + LEVELS[core.currentLevel].name + '\u201d';
        buttonsHtml =
          '<button class="btn btn-primary" id="next-btn">Next Level</button>' +
          '<button class="btn btn-ghost" id="select-btn">Level Select</button>';
      }
    } else {
      title = 'The Brew Runs Cold\u2026';
      sub = 'Out of moves before the cauldron filled.';
      buttonsHtml =
        '<button class="btn btn-primary" id="retry-btn">Retry Level</button>' +
        '<button class="btn btn-ghost" id="select-btn">Level Select</button>';
    }

    showModal(
      '<h2 class="modal-title">' + title + '</h2>' +
      '<p class="modal-sub">' + sub + '</p>' +
      '<div class="modal-score">Final Score<br><span>' + core.score.toLocaleString() + '</span></div>' +
      '<div class="modal-actions">' + buttonsHtml + '</div>'
    );

    const nextBtn = document.getElementById('next-btn');
    if (nextBtn) nextBtn.addEventListener('click', () => {
      hideModal(); startLevel(core.currentLevel + 1);
    });
    const retryBtn = document.getElementById('retry-btn');
    if (retryBtn) retryBtn.addEventListener('click', () => { hideModal(); startLevel(core.currentLevel); });
    const replayBtn = document.getElementById('replay-btn');
    if (replayBtn) replayBtn.addEventListener('click', () => { hideModal(); startLevel(core.currentLevel); });
    const selectBtn = document.getElementById('select-btn');
    if (selectBtn) selectBtn.addEventListener('click', () => {
      hideModal();
      gameScreen.classList.add('hidden');
      showLevelSelect();
      startScreen.classList.remove('hidden');
    });
  }

  const DEFAULT_THEME = { primary: '#ff7a1a', deep: '#c9560a', glow: '#a6ff5c', fogA: '#ff7a1a', fogB: '#5c2d91' };
  // Keep the generous move count, while early boards ask for four times their
  // current score goals. That extra challenge eases down to twice the current
  // goal by the final level, where the larger boards already take longer.
  const LEVEL_PACING = {
    movesBonus: 4,
    targetMultiplier: 3.5,
    earlyTargetFactor: 4,
    lateTargetFactor: 2
  };

  // Hand-tuned play-test goals for the larger boards. The previous compounded
  // multiplier pushed Level 3 to 18,670 points before its difficulty curve had
  // earned that demand. These still increase every level without making the
  // first longer boards a wall.
  const PLAYTEST_TARGETS = {
    3: 8000,
    4: 7000,
    5: 8800,
    6: 15000,
    7: 12000,
    8: 18000,
    9: 16500,
    10: 19500,
    11: 22000,
    12: 24500,
    13: 27000,
    14: 30000,
    15: 33000,
    16: 36500,
    17: 40000,
    18: 44000,
    19: 48500,
    20: 53500,
    21: 58000,
    22: 63000,
    23: 69000,
    24: 75000,
    25: 82000,
    26: 90000,
    27: 98000,
    28: 107000,
    29: 117000,
    30: 128000
  };

  function targetMultiplierFor(levelNumber) {
    const progress = Math.max(0, Math.min(1, (levelNumber - 1) / Math.max(1, LEVELS.length - 1)));
    const taper = LEVEL_PACING.earlyTargetFactor +
      (LEVEL_PACING.lateTargetFactor - LEVEL_PACING.earlyTargetFactor) * progress;
    return LEVEL_PACING.targetMultiplier * taper;
  }

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return r + ',' + g + ',' + b;
  }

  function applyTheme(theme) {
    const t = theme || DEFAULT_THEME;
    const root = document.documentElement.style;
    root.setProperty('--pumpkin', t.primary);
    root.setProperty('--pumpkin-deep', t.deep);
    root.setProperty('--slime', t.glow);
    root.setProperty('--theme-fog-a', t.fogA);
    root.setProperty('--theme-fog-b', t.fogB);
    root.setProperty('--pumpkin-rgb', hexToRgb(t.primary));
  }

  // Boards range from 8x8 up to 10x20 across the ten levels. Tile size is computed from the
  // viewport so a wide short board (level 1) and a narrow tall one (level 10, built for phones
  // in portrait) both fit comfortably -- width drives the size; a tall board is allowed to make
  // the page scroll rather than shrinking tiles below a usable tap size.
  function computeAndApplyTileSize(cols) {
    const gap = 3;
    const viewportW = window.innerWidth || 400;
    // Reserve the same breathing room for the board frame at every size so a
    // 9-column Free Play grid stays fully inside a portrait phone viewport.
    const framePadding = Math.min(20, Math.max(18, Math.round(viewportW * 0.045)));
    const mobileGutter = viewportW <= 600 ? 36 : 0;
    const maxBoardWidth = Math.min(viewportW - mobileGutter - framePadding * 2, 480 - framePadding * 2);
    let tileSize = Math.floor((maxBoardWidth - gap * (cols - 1)) / cols);
    tileSize = Math.max(28, Math.min(52, tileSize));
    const root = document.documentElement.style;
    root.setProperty('--tile-size', tileSize + 'px');
    root.setProperty('--tile-gap', gap + 'px');
  }

  let __resizeCols = null;
  window.addEventListener('resize', () => {
    if (__resizeCols) {
      computeAndApplyTileSize(__resizeCols);
      syncHudToBoard();
    }
  });

  function stopFreePlayTimer() {
    if (freePlayTimer) cancelAnimationFrame(freePlayTimer);
    freePlayTimer = null;
  }

  function clearFreePlayCountdown() {
    if (freePlayCountdownTimer) clearTimeout(freePlayCountdownTimer);
    freePlayCountdownTimer = null;
    freePlayCountdownEl.classList.add('hidden');
  }

  function clearFreePlayScoreReveal() {
    if (freePlayScoreRevealTimer) clearTimeout(freePlayScoreRevealTimer);
    freePlayScoreRevealTimer = null;
    freePlayScoreRevealEl.classList.add('hidden');
  }

  function clearFreePlaySettlePause() {
    if (freePlaySettleTimer) clearTimeout(freePlaySettleTimer);
    freePlaySettleTimer = null;
  }

  function revealFreePlayScore(onDone) {
    clearFreePlayScoreReveal();
    freePlayScoreRevealEl.innerHTML =
      '<div class="free-play-score-reveal-card"><div class="free-play-score-reveal-label">FINAL SCORE</div>' +
      '<div class="free-play-score-reveal-value">' + core.score.toLocaleString() + '</div></div>';
    freePlayScoreRevealEl.classList.remove('hidden');
    freePlayScoreRevealTimer = setTimeout(() => {
      freePlayScoreRevealTimer = null;
      freePlayScoreRevealEl.classList.add('hidden');
      onDone();
    }, 1350);
  }

  function runFreePlayCountdown(onGo) {
    clearFreePlayCountdown();
    const caption = freePlayCountdownEl.querySelector('span');
    const show = (text) => {
      caption.textContent = text;
      caption.style.animation = 'none';
      void caption.offsetWidth;
      caption.style.animation = '';
    };
    show('READY');
    freePlayCountdownEl.classList.remove('hidden');
    freePlayCountdownTimer = setTimeout(() => {
      show('GO!');
      freePlayCountdownTimer = setTimeout(() => {
        freePlayCountdownTimer = null;
        freePlayCountdownEl.classList.add('hidden');
        onGo();
      }, 650);
    }, 850);
  }

  function startFreePlayTimer() {
    const freePlayStartedAt = performance.now();
    let lastTimerPaintAt = 0;
    const tickFreePlayTimer = (now) => {
      if (core.freePlayOver) return;
      freePlayRemainingMs = Math.max(0, FREE_PLAY_SECONDS * 1000 - (now - freePlayStartedAt));
      const nextSeconds = Math.ceil(freePlayRemainingMs / 1000);
      // The fill itself updates every frame; the numeral needs to change only
      // when the visible second changes.
      if (!lastTimerPaintAt || now - lastTimerPaintAt >= 33) {
        paintFreePlayTimer(FREE_PLAY_SECONDS - (freePlayRemainingMs / 1000));
        lastTimerPaintAt = now;
      }
      if (nextSeconds !== freePlaySecondsLeft) {
        freePlaySecondsLeft = nextSeconds;
        updateHUD();
      }
      if (freePlayRemainingMs === 0) {
        stopFreePlayTimer();
        core.freePlayOver = true;
        // Lock new moves immediately, but keep an in-progress cascade on screen
        // until its final explosion and drop have completed.
        freePlayEndPending = true;
        finishFreePlayAfterEffects();
        return;
      }
      freePlayTimer = requestAnimationFrame(tickFreePlayTimer);
    };
    freePlayTimer = requestAnimationFrame(tickFreePlayTimer);
  }

  function finishFreePlayAfterEffects() {
    if (!freePlayEndPending || !core.freePlay || !core.freePlayOver) return;
    if (core.swapInProgress) {
      requestAnimationFrame(finishFreePlayAfterEffects);
      return;
    }
    freePlayEndPending = false;
    // Let the final burst be seen clearly before the score sequence starts.
    clearFreePlaySettlePause();
    freePlaySettleTimer = setTimeout(() => {
      freePlaySettleTimer = null;
      if (!core.freePlay || !core.freePlayOver) return;
      revealFreePlayScore(() => {
        if (core.freePlay && core.freePlayOver) endGame(false);
      });
    }, 2000);
  }

  function showMainMenu() {
    gameModeChoiceEl.classList.remove('hidden');
    levelSelectWrapEl.classList.add('hidden');
    applyTheme(DEFAULT_THEME);
  }

  function showLevelSelect() {
    gameModeChoiceEl.classList.add('hidden');
    levelSelectWrapEl.classList.remove('hidden');
    renderLevelSelect();
  }

  function startFreePlay(mode = 'free') {
    if (core.swapInProgress) return;
    stopFreePlayTimer();
    clearFreePlayScoreReveal();
    clearFreePlaySettlePause();
    freePlayEndPending = false;
    pumpkinChallenge = mode === 'pumpkin';
    core.freePlay = true;
    core.freePlayOver = false;
    core.currentLevel = 0;
    core.score = 0;
    core.movesLeft = 0;
    core.targetScore = 0;
    core.selectedIndex = null;
    core.isBusy = false;
    freePlaySecondsLeft = FREE_PLAY_SECONDS;
    freePlayRemainingMs = FREE_PLAY_SECONDS * 1000;
    levelMovesTotal = FREE_PLAY_SECONDS;
    if (levelNameBannerEl) levelNameBannerEl.textContent = pumpkinChallenge ? 'Pumpkin Challenge · 1:30 High Score' : 'Free Play · 1:30 High Score';
    if (levelDetailsBottomEl) levelDetailsBottomEl.innerHTML = '';
    applyTheme(pumpkinChallenge ? { primary: '#ff9d20', deep: '#8a350f', glow: '#ffe1a1', fogA: '#ff8b19', fogB: '#35102b' } : { primary: '#ff54c8', deep: '#7a2275', glow: '#b8f3ff', fogA: '#ff54c8', fogB: '#1b125a' });
    __resizeCols = FREE_PLAY_COLS;
    computeAndApplyTileSize(FREE_PLAY_COLS);
    clearMoveHint();
    core.setActiveTileTypes(pumpkinChallenge ? PUMPKIN_CHALLENGE_TILE_TYPES : FREE_PLAY_TILE_TYPES);
    core.createBoard(FREE_PLAY_COLS, FREE_PLAY_ROWS, FREE_PLAY_SHAPE);
    assignHoleDecorations([], false);
    buildBoardDOM();
    render();
    updateHUD();
    syncHudToBoard();
    startScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    gameScreen.classList.add('free-play');
    core.isBusy = true;
    runFreePlayCountdown(() => {
      core.isBusy = false;
      scheduleMoveHint();
      startFreePlayTimer();
    });
  }

  function startLevel(levelNum) {
    if (core.swapInProgress) return; // a previous swap is still resolving; refuse to reassign shared board state
    stopFreePlayTimer();
    clearFreePlayScoreReveal();
    clearFreePlaySettlePause();
    core.freePlay = false;
    core.freePlayOver = false;
    pumpkinChallenge = false;
    gameScreen.classList.remove('free-play');
    const lvl = LEVELS.find((l) => l.n === levelNum) || LEVELS[0];
    const levelMoves = lvl.moves + LEVEL_PACING.movesBonus;
    const levelTarget = PLAYTEST_TARGETS[lvl.n] || Math.round((lvl.target * targetMultiplierFor(lvl.n)) / 10) * 10;
    core.currentLevel = lvl.n;
    core.score = 0;
    core.movesLeft = levelMoves;
    levelMovesTotal = levelMoves;
    core.targetScore = levelTarget;
    core.selectedIndex = null;
    core.isBusy = false;
    if (levelNameBannerEl) levelNameBannerEl.textContent = 'Level ' + lvl.n + ' · ' + lvl.name;
    if (levelDetailsBottomEl) levelDetailsBottomEl.innerHTML = '';
    applyTheme(lvl.theme);
    __resizeCols = lvl.cols;
    computeAndApplyTileSize(lvl.cols);
    clearMoveHint();
    core.setActiveTileTypes(lvl.tiles);
    core.createBoard(lvl.cols, lvl.rows, lvl.shape);
    // Visual trial for Level 11 only.  It shares normal gravity, but trades
    // are blocked above so we can judge the look before defining its full rule set.
    if (lvl.pumpkinPreview) {
      for (const [row, col] of lvl.pumpkinPreview) {
        const cell = core.idx(row, col);
        if (!core.isHole(cell)) core.board[cell] = { type: 0, special: 'pumpkin', hits: 2 };
      }
    }
    // Stones are placed last so hand-arranged stone centers always remain visible
    // inside their surrounding pumpkin frames.
    core.placeStoneBlocks(lvl.stones);
    // Visual QA route only: lets us inspect stone states without changing rules.
    const stonePreview = new URLSearchParams(window.location.search).get('stone-preview');
    if (stonePreview) {
      if (stonePreview === 'color-second') {
        // Nine side-by-side QA samples: three blue, three pink, three purple.
        // All are in the second-hit state (first-hit glow plus color-matched emitter).
        core.board.forEach((tile, index) => {
          if (tile && tile.stone !== undefined) core.board[index] = { type: index % TILE_TYPES.length, special: null };
        });
        const samples = [[1,1,12],[1,3,13],[1,5,14],[4,1,0],[4,3,1],[4,5,2],[7,1,18],[7,3,19],[7,5,20]];
        samples.forEach(([row,col,style]) => {
          const cell = row * core.COLS + col;
          if (!core.isHole(cell)) core.board[cell] = { stone: style, hits: 1, special: null };
        });
      } else {
        const previewStone = stonePreview === 'hat-first' || stonePreview === 'hat-second'
        ? core.board.find((tile) => tile && tile.stone === 1)
        : core.board.find((tile) => tile && tile.stone !== undefined);
        if (previewStone) previewStone.hits = stonePreview === 'hat-first' ? 2 : 1;
      }
    }
    assignHoleDecorations(lvl.n === 2 ? ['🪦'] : lvl.decor, lvl.n === 2);
    buildBoardDOM();
    render();
    updateHUD();
    syncHudToBoard();
    startScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    scheduleMoveHint();
  }

  function renderLevelSelect() {
    applyTheme(DEFAULT_THEME);
    levelSelectEl.innerHTML = '';
    LEVELS.forEach((lvl) => {
      const unlocked = lvl.n <= core.highestUnlocked;
      const completed = lvl.n < core.highestUnlocked;
      const card = document.createElement('div');
      card.className = 'level-card' + (unlocked ? '' : ' locked') + (completed ? ' completed' : '');
      if (unlocked) {
        card.innerHTML =
          (completed ? '<span class="level-check">\u2713</span>' : '') +
          '<div class="level-num">' + lvl.n + '</div>';
        card.addEventListener('click', () => {
          ensureAudio();
          startLevel(lvl.n);
        });
      } else {
        card.innerHTML = '<div class="level-num">' + lvl.n + '</div><div class="level-lock">\ud83d\udd12</div>';
      }
      levelSelectEl.appendChild(card);
    });
  }

  renderLevelSelect();
  showMainMenu();

  levelsModeBtn.addEventListener('click', showLevelSelect);
  freePlayBtn.addEventListener('click', () => { ensureAudio(); startFreePlay(); });
  pumpkinChallengeBtn.addEventListener('click', () => { ensureAudio(); startFreePlay('pumpkin'); });
  levelsBackBtn.addEventListener('click', showMainMenu);

  menuBtn.addEventListener('click', () => {
    if (core.isBusy) return;
    stopFreePlayTimer();
    clearFreePlayScoreReveal();
    clearFreePlaySettlePause();
    core.freePlay = false;
    core.freePlayOver = false;
    pumpkinChallenge = false;
    gameScreen.classList.add('hidden');
    showMainMenu();
    startScreen.classList.remove('hidden');
  });

  muteBtn.addEventListener('click', () => {
    const wasMuted = core.muted;
    // A short audible cue before muting makes the control's state immediately obvious.
    if (!wasMuted) playSound('swap');
    core.muted = !core.muted;
    muteBtn.dataset.muted = core.muted ? 'true' : 'false';
    muteBtn.setAttribute('aria-label', core.muted ? 'Unmute sound' : 'Mute sound');
    syncBackgroundMusic();
    if (!core.muted) playSound('match');
  });

  window.__game = {
    render, animateSwap, animateClear, spawnStoneImpact, spawnStoneScore, playSound, updateHUD, endGame, shakeSingle, scheduleMoveHint
  };
})();
</script>
